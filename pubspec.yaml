name: student_eportfolio
description: Student E-Portfolio App built with Flutter and Material 3.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  carousel_slider: ^5.0.0
  video_player: ^2.9.2
  url_launcher: ^6.3.1
  syncfusion_flutter_pdfviewer: ^28.1.33

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/certificates/
    - assets/achievements/
